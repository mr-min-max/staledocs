# Keep CI on the default branch so pushes and pull requests share one gate.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Verify protected Git identities
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.name mr-min-max
          git config --local user.email 254284659+mr-min-max@users.noreply.github.com
          node scripts/public-beta-preflight.mjs --json --candidate-ref HEAD --skip-source-artifacts --main-ref origin/main
      - run: npm ci
      - run: npm run verify:release
      - run: node dist/cli/index.js score --min 80
      - run: npm run test:coverage
      - name: Upload coverage
        if: matrix.node-version == 22
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
