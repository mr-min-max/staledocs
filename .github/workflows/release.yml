name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Verify protected Git identities
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.name mr-min-max
          git config --local user.email 254284659+mr-min-max@users.noreply.github.com
          node scripts/public-beta-preflight.mjs --json --candidate-ref HEAD --skip-source-artifacts --main-ref origin/main
      - name: Verify annotated release tag
        run: >-
          node scripts/verify-pushed-release-tag.mjs
          --ref "$GITHUB_REF"
      - name: Verify release candidate
        run: >-
          node scripts/verify-release-candidate.mjs
          --main-ref origin/main
          --candidate-ref HEAD
          --tag "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run verify:release
      - name: Pack release artifact
        if: matrix.node-version == 24
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/staledocs-package"
          mkdir -p "$artifact_dir"
          npm pack --json --pack-destination "$artifact_dir" \
            > "$artifact_dir/pack.json"
          filename="$(node -e "const fs=require('fs'); const p=process.argv[1]; const files=JSON.parse(fs.readFileSync(p, 'utf8')); if (files.length !== 1 || !files[0].filename) throw new Error('Expected exactly one packed tarball'); process.stdout.write(files[0].filename)" "$artifact_dir/pack.json")"
          tarball="$artifact_dir/$filename"
          checksum="$tarball.sha256"
          (
            cd "$artifact_dir"
            sha256sum "$filename" > "$filename.sha256"
          )
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - name: Smoke exact release artifact
        if: matrix.node-version == 24
        env:
          STALEDOCS_TEST_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          npm run test:package
          npm run test:mcp
      - name: Upload verified artifact
        if: matrix.node-version == 24
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staledocs-npm-package
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.checksum }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download verified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staledocs-npm-package
          path: ${{ runner.temp }}/staledocs-artifact
      - name: Validate verified artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/staledocs-artifact"
          shopt -s nullglob
          tarballs=(*.tgz)
          checksums=(*.sha256)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one verified tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          if [ "${#checksums[@]}" -ne 1 ]; then
            echo "Expected exactly one checksum, found ${#checksums[@]}" >&2
            exit 1
          fi
          if [ "${checksums[0]}" != "${tarballs[0]}.sha256" ]; then
            echo "Checksum does not match the verified tarball name" >&2
            exit 1
          fi
          sha256sum --check --strict "${checksums[0]}"
          echo "tarball=$PWD/${tarballs[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Verify npm trusted-publishing support
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node -e 'const p=process.argv[1].split(".").map(Number); const ok=p.length===3 && p.every(Number.isInteger) && (p[0]>11 || (p[0]===11 && (p[1]>5 || (p[1]===5 && p[2]>=1)))); if (!ok) { console.error("npm 11.5.1 or newer is required"); process.exit(1); }' "$npm_version"
      - name: Publish verified artifact
        run: >-
          npm publish "${{ steps.artifact.outputs.tarball }}"
          --ignore-scripts
          --access public
          --tag beta
          --provenance

  github-release:
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download verified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staledocs-npm-package
          path: ${{ runner.temp }}/staledocs-artifact
      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/staledocs-artifact"
          shopt -s nullglob
          tarballs=(*.tgz)
          checksums=(*.sha256)
          test "${#tarballs[@]}" -eq 1
          test "${#checksums[@]}" -eq 1
          test "${checksums[0]}" = "${tarballs[0]}.sha256"
          sha256sum --check --strict "${checksums[0]}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/staledocs-artifact/*.tgz
            ${{ runner.temp }}/staledocs-artifact/*.sha256
