version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Kiev
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Major migrations need explicit module/toolchain/runtime review.
    # Minor, patch, and security updates remain enabled.
    ignore:
      - dependency-name: chalk
        update-types: ["version-update:semver-major"]
      - dependency-name: ora
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: cosmiconfig
        update-types: ["version-update:semver-major"]
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Europe/Kiev
    open-pull-requests-limit: 3
    labels:
      - dependencies
